<!doctype html>
<html lang="nb">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="SPY is a fast social deduction party game for one phone. Everyone knows the location except the spy."
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#030507" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SPY — Social Deduction Party Game" />
    <meta
      property="og:description"
      content="Pass one phone around and find the spy before they blend in."
    />
    <meta property="og:locale" content="nb_NO" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="SPY — Social Deduction Party Game" />
    <meta
      name="twitter:description"
      content="Pass one phone around and find the spy before they blend in."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <script>
      (() => {
        try {
          const key = "spy-theme";
          const stored = window.localStorage.getItem(key);
          const theme = stored === "light" || stored === "dark" ? stored : "dark";
          document.documentElement.dataset.theme = theme;
          const color = theme === "dark" ? "#030507" : "#f4f7fb";
          document.querySelector("meta[name='theme-color']")?.setAttribute("content", color);
        } catch {
          document.documentElement.dataset.theme = "dark";
          document.querySelector("meta[name='theme-color']")?.setAttribute("content", "#030507");
        }
      })();
    </script>
    <title>SPY — Social Deduction Party Game</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
