<!doctype html>
<html lang="nb">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="SPY er et raskt spionspill (spy game) for én telefon. Alle vet lokasjonen, bortsett fra spionen."
    />
    <meta name="keywords" content="spionspill, spy game, sosialt deduksjonsspill, partyspill, SPY" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#030507" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SPY — Spionspill / Spy Game" />
    <meta
      property="og:description"
      content="Send én telefon rundt og finn spionen i dette raske spionspillet (spy game)."
    />
    <meta property="og:locale" content="nb_NO" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="SPY — Spionspill / Spy Game" />
    <meta
      name="twitter:description"
      content="Send én telefon rundt og finn spionen i dette raske spionspillet (spy game)."
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Game",
        "name": "SPY",
        "alternateName": ["Spionspill", "Spy Game"],
        "description": "Et raskt sosialt deduksjonsspill for én telefon der spillerne finner spionen.",
        "genre": ["Party game", "Social deduction"],
        "inLanguage": ["nb", "en"]
      }
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <script>
      (() => {
        try {
          const key = "spy-theme";
          const stored = window.localStorage.getItem(key);
          const theme = stored === "light" || stored === "dark" ? stored : "dark";
          document.documentElement.dataset.theme = theme;
          const color = theme === "dark" ? "#030507" : "#f4f7fb";
          document.querySelector("meta[name='theme-color']")?.setAttribute("content", color);
        } catch {
          document.documentElement.dataset.theme = "dark";
          document.querySelector("meta[name='theme-color']")?.setAttribute("content", "#030507");
        }
      })();
    </script>
    <title>SPY — Spionspill / Spy Game på nett</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
